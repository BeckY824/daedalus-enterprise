name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一个 PR 又推了新提交，旧的那轮直接取消，别排队白跑（10-24 提速）。
# push 到 main 按提交分组：每个合进来的提交都跑完，不互相取消。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# PR 全套（11-18，加急修复用）：PR 带标签 full-ci，或分支名以 hotfix/ 开头，这一轮就和推 main 跑得一模一样——
# 单测不做牵连筛选、E2E / 排版闸门不加 --max-failures=2（其余任务 PR 和推送本来就一样）。
# 部署脚本（ent-lib.zsh ci_main_ok）认「单测范围」任务日志里的「CI范围=全套 测试代码树=<tree>」：main 上同样代码的 CI 还在跑时，
# PR 全套绿 + 测试代码树等于构建 tree 也放行。
# 标签只看触发这一轮时的快照：要「先加标签再推」（或开 PR 时就带上）；已经跑过的，加标签后点 Re-run 不生效
# （重跑沿用原事件的标签），要再推一个提交（git commit --allow-empty 也行）才会按全套跑。hotfix/ 分支没有这个问题
env:
  ENT_CI_FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || startsWith(github.head_ref, 'hotfix/') }}

# 10-26 分仓库：企业版仓库不跑托管版 E2E、网页对桌面端截图（桌面端在 daedalus-crm 那边测）。
# 10-24 提速：单测、E2E、排版闸门都拆成几片并行跑，用例和闸门规则一条不动，只改怎么跑。
# 10-28 瘦身：这个仓库只发企业版（部署都开 CRM_ENTERPRISE=1），只验开关关着的两组任务
# （E2E 网页 1–5/5、和 main 逐字段一致的差分）护不住我们发出去的东西，删掉。
# 分支保护认的三个必过检查名字不变：「类型 / 代码检查 / 单元测试」「E2E」「密钥扫描」，
# 前两个现在是汇总 job，等各片跑完、全绿才绿。10-29 起「E2E」也等速度闸门（perf）。
jobs:
  lint:
    name: 类型 / 代码检查（tsc + eslint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 装依赖断网（Prisma 引擎下载 ECONNRESET，10-28 #47 后 main 红过）重试 2 次，别整轮重跑
      - run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci 第 $i 次失败，15 秒后重试"; sleep 15; done
        # 上线用到的依赖有高危及以上漏洞就红（H-068，10-04 起）。修不了上游的用 package.json 的 overrides 钉住
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
        # 托管版的控制面客户端也要生成，否则 import @/generated/control 编译不过
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      - run: npx tsc --noEmit
      - run: npx eslint .

  # 测试影响分析（11-17，简化版）：PR 只跑改动牵连到的单测，推 main 照跑全套兜底。选法见 scripts/ci/related-tests.mjs：
  # 依赖图（顺着 import 反查，比 vitest related 宽）∪ 按路径读源码的用例 ∪ 静态守门；改到 prisma/、依赖、vitest / vite / tsconfig /
  # eslint 配置、.github/、hooks/ 等自动退回全套。只管单元测试；类型 / 代码检查、E2E、排版闸门、速度闸门照跑
  select:
    name: 单测范围
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      shards: ${{ steps.pick.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
      - id: pick
        env:
          BASE_REF: ${{ github.base_ref }}
        # 最后一行打范围标记（部署脚本认）：全套 = 这一轮和推 main 完全一样；牵连 = 单测只跑牵连的；
        # 单测全套 = related-tests 自己退回了全套，但 E2E 仍按 PR 设置（--max-failures=2），部署脚本不认它。
        # 标记用 ${scope} 拼出来，日志里回显的脚本原文就不会被认成标记；测试代码树 = 这一轮实际测的代码（PR 是和 base 的合并结果）
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"; echo "推送：全套"; scope=全套; echo "CI范围=${scope}"; exit 0
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          if [ "$ENT_CI_FULL" = true ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"; echo "PR 全套（标签 full-ci 或 hotfix/ 分支）：单测不筛、E2E 不提前停，和推 main 一样"
            scope=全套; echo "CI范围=${scope} 测试代码树=${tree}"; exit 0
          fi
          git fetch -q origin "$BASE_REF"
          node scripts/ci/related-tests.mjs select --base "$(git merge-base FETCH_HEAD HEAD)" --shards 8
          if grep -q '^mode=full$' "$GITHUB_OUTPUT"; then scope=单测全套; else scope=牵连; fi
          echo "CI范围=${scope} 测试代码树=${tree}"

  unit:
    # 11-17：4 片各 10–14 分钟，是 CI 关键路径；仓库公开、runner 免费，拆成 8 片
    # PR 相关模式下每片只跑分给它的那几个用例，分不到的直接通过（job 名不变，聚合 job 照旧看 needs.unit.result）
    name: 单元测试 ${{ matrix.shard }}/8
    needs: select
    # 钉 24.04：ubuntu-latest 2026-10-28 起逐步换成 26.04，Playwright 1.56 在上面装不了 chromium，整片挂
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - id: scope
        name: 这片跑什么
        env:
          MODE: ${{ needs.select.outputs.mode }}
          SHARDS: ${{ needs.select.outputs.shards }}
        run: |
          if [ "$MODE" != related ]; then
            # 11-28 O4：全套按耗时表均分（scripts/ci/shard-unit.mjs），不再用 vitest --shard（按文件数切，8 片 334–752 秒，最慢片拖整轮）。
            # 需要先 checkout，所以只在这里标记，实际文件清单在下一步「分片清单」里算
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "args=" >> "$GITHUB_OUTPUT"; echo "timed=true" >> "$GITHUB_OUTPUT"; echo "全套：按耗时表分片 ${{ matrix.shard }}/8"; exit 0
          fi
          files=$(echo "$SHARDS" | jq -r '.[${{ matrix.shard }} - 1][]?' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "相关模式：这片没分到用例，直接通过"; exit 0; fi
          echo "run=true" >> "$GITHUB_OUTPUT"; echo "args=$files" >> "$GITHUB_OUTPUT"; echo "相关模式：$files"
      - uses: actions/checkout@v4
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      # 装依赖断网（Prisma 引擎下载 ECONNRESET，10-28 #47 后 main 红过）重试 2 次，别整轮重跑
      - if: steps.scope.outputs.run == 'true'
        run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci 第 $i 次失败，15 秒后重试"; sleep 15; done
      - if: steps.scope.outputs.run == 'true'
        run: npx prisma generate
      - if: steps.scope.outputs.run == 'true'
        run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      # 浏览器按 Playwright 版本缓存：命中了下面那步只补系统依赖，不再每次下载 Chromium（10-24 提速）
      - name: 缓存 Playwright 浏览器
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        # 有几份单测在真 Chromium 里点组件（ai-settings-ui、import-ai-columns-ui、r6-review-otp、r7-review-auth-ui），
        # 没装浏览器整份起不来（2026-10-05 main 上第一次撞到）
      - if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - id: timed
        name: 分片清单（全套按耗时均分；--check 要用 vitest，所以放在装依赖之后）
        if: steps.scope.outputs.timed == 'true'
        run: |
          node scripts/ci/shard-unit.mjs --check 8
          a=$(node scripts/ci/shard-unit.mjs ${{ matrix.shard }} 8)
          [ -n "$a" ] || { echo "分片清单为空"; exit 1; }
          echo "args=$a" >> "$GITHUB_OUTPUT"
        # 与生产（Dockerfile 的 ENV TZ=Asia/Shanghai）一致。
        # vitest.config.ts 里也钉了一道，这里再写一次是为了让人看 workflow 就知道。
        # 每片在自己的机器上跑，测试库 prisma/test.db 各建各的，互不干扰
        # 多挂一个 json 报告只为留逐文件耗时（dot 不带），过不过仍由 vitest 退出码定
      - if: steps.scope.outputs.run == 'true'
        run: npx vitest run ${{ steps.scope.outputs.timed == 'true' && steps.timed.outputs.args || steps.scope.outputs.args }} --passWithNoTests --reporter=dot --reporter=json --outputFile.json=test-results/vitest-timing-${{ matrix.shard }}.json
        env:
          TZ: Asia/Shanghai
      # 下面两步只看耗时，自己出错不许把这一片变红
      - name: 最慢的 20 个测试文件
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        continue-on-error: true
        run: |
          jq -r '[.testResults[] | {s: ((.endTime - .startTime) / 1000), f: (.name | sub("^.*/tests/"; "tests/"))}]
            | sort_by(-.s) | .[:20][] | "\(.s * 10 | round / 10)s\t\(.f)"' \
            test-results/vitest-timing-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        continue-on-error: true
        with:
          name: vitest-timing-${{ matrix.shard }}
          path: test-results/vitest-timing-${{ matrix.shard }}.json
          retention-days: 14

  check:
    name: 类型 / 代码检查 / 单元测试
    needs: [lint, unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 各片都绿才算过
        run: |
          echo "类型 / 代码检查：${{ needs.lint.result }}；单元测试各片：${{ needs.unit.result }}"
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.unit.result }}" = success ]

  e2e-web-ent:
    name: E2E 网页·企业版开 ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      # 容器里没有 setup-node，npm 下载缓存自己存（10-24 提速）
      - name: 缓存 npm 下载
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('package-lock.json') }}
      # 装依赖断网（Prisma 引擎下载 ECONNRESET，10-28 #47 后 main 红过）重试 2 次，别整轮重跑
      - run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci 第 $i 次失败，15 秒后重试"; sleep 15; done
      # next build 用 Next 的增量编译缓存；源码没变的部分直接复用（10-24 提速）
      - name: 缓存 Next 构建
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'public/**') }}
          restore-keys: |
            next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-
      - run: npx prisma generate
        # 托管版的控制面客户端也要生成，否则 import @/generated/control 编译不过
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      # 默认网页验生产构建，避免只验证 dev server；仍使用隔离 E2E 库。
      # 每片各自 next build、各自跑 globalSetup 建空库；片内仍按文件串行
      # 网页用例在开着企业版开关的服务器上跑（2026-10-27）：桌面端 / 团队版攒下的流程就是企业版的回归标准。
      # 开关关着那遍 10-28 删了：这个仓库只发企业版。
      # 设计上就不一样的按文件跳过，名单和理由在 e2e-ent/网页用例企业版跳过.json
      # PR 上同一片挂满 2 条（重试后仍红才算）就停，别把剩下的跑完白等；推 main 和 PR 全套（ENT_CI_FULL）照样全跑完，红几条看全（10-28）
      # 6 片（10-28，原 5 片）：按 main 绿跑各文件实测耗时模拟 playwright 的按条数切法，
      # 5 片最慢一片用例 ~188 秒、6 片 ~150 秒、7 片 ~128 秒；第 7 片再省 20 秒不值一台机器的固定开销（装依赖 + 构建 ~3–4 分钟）。
      # 最大的文件（workbench ~67 秒）远小于每片 ~105 秒的均值，不用拆文件
      - run: npx playwright test --shard=${{ matrix.shard }}/6 ${{ env.ENT_CI_FULL != 'true' && '--max-failures=2' || '' }}
        env:
          CRM_ENTERPRISE: "1"
          E2E_PROD: "1"
          HOME: /root
          # 用例的浏览器固定 Asia/Shanghai，服务端也要一致，否则日期文案水合失配
          TZ: Asia/Shanghai
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-web-ent-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  e2e-ent-flow:
    name: E2E 企业版主流程
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: 缓存 npm 下载
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('package-lock.json') }}
      # 装依赖断网（Prisma 引擎下载 ECONNRESET，10-28 #47 后 main 红过）重试 2 次，别整轮重跑
      - run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci 第 $i 次失败，15 秒后重试"; sleep 15; done
      - run: npx prisma generate
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      # 只有企业版才有的流程（2026-10-27）：四类账号、导入导出权限、跳转、组织设置、项目公海整体转让。
      # 自己的库和种子（e2e-ent/global-setup.ts），测试密码每轮随机、不进仓库
      - run: npm run test:ent -- ${{ env.ENT_CI_FULL != 'true' && '--max-failures=2' || '' }}
        env:
          HOME: /root
          TZ: Asia/Shanghai
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-ent-flow
          path: test-results/
          retention-days: 7

  e2e-layout:
    name: 排版闸门 ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: 缓存 npm 下载
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('package-lock.json') }}
      # 装依赖断网（Prisma 引擎下载 ECONNRESET，10-28 #47 后 main 红过）重试 2 次，别整轮重跑
      - run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci 第 $i 次失败，15 秒后重试"; sleep 15; done
      - name: 缓存 Next 构建
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'public/**') }}
          restore-keys: |
            next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-
      - run: npx prisma generate
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      # 发版前排版闸门（10-19）：企业版服务（e2e-layout/企业版.ts 建库灌数据，10-28 起）+ 像真客户的数据，1024/1280/1366 × AI 栏常驻 / 左栏最宽量主要页面越界、被盖住。
      # 这几天的显示 bug 都是客户先发现的，以后让它在这里先红。规则见 e2e/layout-audit.ts，不许为了变绿放宽
      # 不用 --shard：它按用例条数切、不看耗时。哪片跑哪几份写在 playwright.layout.config.ts 的分片表里，按实测秒数排（10-28）
      - run: npx playwright test -c playwright.layout.config.ts ${{ env.ENT_CI_FULL != 'true' && '--max-failures=2' || '' }}
        env:
          LAYOUT_SHARD: ${{ matrix.shard }}
          E2E_PROD: "1"
          HOME: /root
          TZ: Asia/Shanghai
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-layout-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # 速度闸门（10-29，测试规划 S4 + S12）：生产构建起服务，30 人 × 1 倍数据各压 60 秒，
  # A（全员看全部）和 B（按组织看，org-seed 后同一份库再压一轮）每页 p95 < 300 ms、0 出错；
  # 顺带量登录 / 首页 / 客户列表首屏 JS（HTML 里全部 script 逐个 gzip -6 求和），
  # 超上限或比 scripts/perf/first-js-baseline.json 涨 > 10% 就红。本机 1 倍 p95 ~50 ms，CI 机慢 2–3 倍也还有余量
  # 11-01 起每轮连压 3 次、各页取 3 次 p95 的中位数再比 300 ms：CI 机时快时慢，同一个提交重跑过一绿一红
  # 11-17：A、B 两轮原来串在一个 job 里共 11 分钟，拆成两片并行；B 片自己造库（--prepare-only）、org-seed 后再压。
  # needs.perf.result 是两片合起来的结果，下面 E2E 聚合不用改；job 名仍以「速度闸门」开头（merge-now.sh 按前缀认）
  perf:
    name: 速度闸门 ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [A, B]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 装依赖断网（Prisma 引擎下载 ECONNRESET，10-28 #47 后 main 红过）重试 2 次，别整轮重跑
      - run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci 第 $i 次失败，15 秒后重试"; sleep 15; done
      - name: 缓存 Next 构建
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'public/**') }}
          restore-keys: |
            next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-
      - run: npx prisma generate
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      - name: A：全员看全部 + 首屏 JS
        if: matrix.part == 'A'
        # 红了也把这轮的表留下，Summary 里看得到
        run: |
          rc=0; node scripts/perf/enterprise-p95.mjs --out /tmp/perf --scale 1 --duration 60 --rounds 3 --extra --limit 300 --first-js || rc=$?
          cp /tmp/perf/result.md /tmp/perf/A.md 2>/dev/null || true
          exit $rc
        env:
          GATE: "1"
      - name: B：按组织看
        if: matrix.part == 'B'
        # 线 400（11-02 用户放宽）：同一份代码 CI 上 114～367 ms，300 太贴机器波动；A 还是 300
        # 和 A 同样的库（--scale 1 --extra）先造好，org-seed 后再构建、压
        run: |
          node scripts/perf/enterprise-p95.mjs --out /tmp/perf --scale 1 --extra --prepare-only
          DATABASE_URL=file:/tmp/perf/crm.db SEED=/tmp/perf/seed.json NODE_ENV=development npx tsx scripts/perf/enterprise-org-seed.ts
          node scripts/perf/enterprise-p95.mjs --out /tmp/perf --scale 1 --duration 60 --rounds 3 --extra --limit 400 --reuse-db
        env:
          GATE: "1"
      - name: 结果写进 Summary
        if: always()
        run: cat /tmp/perf/result.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-gate-${{ matrix.part }}
          path: |
            /tmp/perf/*.md
            /tmp/perf/*.json
            /tmp/perf/server.log
          retention-days: 7

  e2e:
    name: E2E
    needs: [e2e-web-ent, e2e-ent-flow, e2e-layout, perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 各片都绿才算过
        run: |
          echo "网页·企业版开：${{ needs.e2e-web-ent.result }}；企业版主流程：${{ needs.e2e-ent-flow.result }}；排版闸门：${{ needs.e2e-layout.result }}；速度闸门：${{ needs.perf.result }}"
          [ "${{ needs.e2e-web-ent.result }}" = success ] && [ "${{ needs.e2e-ent-flow.result }}" = success ] && [ "${{ needs.e2e-layout.result }}" = success ] && [ "${{ needs.perf.result }}" = success ]

  # 每轮 CI 的真实耗时写进本轮的 Summary：总墙钟 + 每个 job，便于盯「总耗时 ≤ 12 分钟」
  timing:
    name: 耗时
    needs: [check, e2e, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: 写耗时表
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" > jobs.json
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at > start.txt
          {
            echo "## CI 耗时"
            jq -r --arg start "$(cat start.txt)" '
              def t: fromdateiso8601;
              def mmss: "\(. / 60 | floor)分\(. % 60)秒";
              [.jobs[] | select(.name != "耗时" and .completed_at != null)] as $j
              | "总墙钟（开跑到最后一个 job 结束）：**\(([$j[].completed_at | t] | max) - ($start | t) | mmss)**",
                "",
                "| job | 结果 | 排队 | 运行 |",
                "|---|---|---|---|",
                ($j | sort_by(.started_at)[] | "| \(.name) | \(.conclusion) | \((.started_at | t) - (.created_at | t) | mmss) | \((.completed_at | t) - (.started_at | t) | mmss) |")
            ' jobs.json
          } >> "$GITHUB_STEP_SUMMARY"

  gitleaks:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 直接跑二进制而不用 gitleaks-action：后者对只有一个提交的历史会在 git log 上报
      # "stderr is not empty"（根提交没有父提交）。扫全部历史，不只是这次 push 的差量。
      # 11-08 发布文件下载连续三次 504（拿到的是错误页，tar 报 not in gzip format）：
      # curl 失败就重试，还不行改走 API（gh release download，另一条下载路径）
      - name: 安装 gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=gitleaks_8.24.3_linux_x64.tar.gz
          # 官方 gitleaks_8.24.3_checksums.txt 里这个包的 sha256；升版本时一起换
          sum=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          # 下载 → 校验和 → 解包 → 能报版本，四步有一步不过就整轮重来，最多 3 轮。
          # 以前只重试下载：拿到坏包（下载成功但内容不对）时 tar 直接让整个任务红。
          # 3 轮都不过照旧红，不放行——扫描那一步不变。
          for i in 1 2 3; do
            rm -f "$f" gitleaks
            { curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$f" \
                "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/$f" \
                || { rm -f "$f"; gh release download v8.24.3 -R gitleaks/gitleaks -p "$f"; }; } \
              && echo "$sum  $f" | sha256sum -c - \
              && tar xzf "$f" gitleaks \
              && ./gitleaks version \
              && break
            if [ "$i" = 3 ]; then echo "::error::gitleaks 下载 / 校验 3 轮都没过"; exit 1; fi
            echo "gitleaks 第 $i 轮下载或校验失败，10 秒后重试"; sleep 10
          done
      - name: 扫描全部提交
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一个 PR 又推了新提交，旧的那轮直接取消，别排队白跑（10-24 提速）。
# push 到 main 按提交分组：每个合进来的提交都跑完，不互相取消。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 10-26 分仓库：企业版仓库不跑托管版 E2E、网页对桌面端截图（桌面端在 daedalus-crm 那边测）。
# 10-24 提速：单测、E2E、排版闸门都拆成几片并行跑，用例和闸门规则一条不动，只改怎么跑。
# 10-28 瘦身：这个仓库只发企业版（部署都开 CRM_ENTERPRISE=1），只验开关关着的两组任务
# （E2E 网页 1–5/5、和 main 逐字段一致的差分）护不住我们发出去的东西，删掉。
# 分支保护认的三个必过检查名字不变：「类型 / 代码检查 / 单元测试」「E2E」「密钥扫描」，
# 前两个现在是汇总 job，等各片跑完、全绿才绿。10-29 起「E2E」也等速度闸门（perf）。
jobs:
  lint:
    name: 类型 / 代码检查（tsc + eslint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 装依赖断网（Prisma 引擎下载 ECONNRESET，10-28 #47 后 main 红过）重试 2 次，别整轮重跑
      - run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci 第 $i 次失败，15 秒后重试"; sleep 15; done
        # 上线用到的依赖有高危及以上漏洞就红（H-068，10-04 起）。修不了上游的用 package.json 的 overrides 钉住
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
        # 托管版的控制面客户端也要生成，否则 import @/generated/control 编译不过
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      - run: npx tsc --noEmit
      - run: npx eslint .

  unit:
    name: 单元测试 ${{ matrix.shard }}/4
    # 钉 24.04：ubuntu-latest 2026-10-28 起逐步换成 26.04，Playwright 1.56 在上面装不了 chromium，整片挂
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 装依赖断网（Prisma 引擎下载 ECONNRESET，10-28 #47 后 main 红过）重试 2 次，别整轮重跑
      - run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci 第 $i 次失败，15 秒后重试"; sleep 15; done
      - run: npx prisma generate
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      # 浏览器按 Playwright 版本缓存：命中了下面那步只补系统依赖，不再每次下载 Chromium（10-24 提速）
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        # 有几份单测在真 Chromium 里点组件（ai-settings-ui、import-ai-columns-ui、r6-review-otp、r7-review-auth-ui），
        # 没装浏览器整份起不来（2026-10-05 main 上第一次撞到）
      - run: npx playwright install --with-deps chromium
        # 与生产（Dockerfile 的 ENV TZ=Asia/Shanghai）一致。
        # vitest.config.ts 里也钉了一道，这里再写一次是为了让人看 workflow 就知道。
        # 每片在自己的机器上跑，测试库 prisma/test.db 各建各的，互不干扰
      - run: npx vitest run --shard=${{ matrix.shard }}/4 --reporter=dot
        env:
          TZ: Asia/Shanghai

  check:
    name: 类型 / 代码检查 / 单元测试
    needs: [lint, unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 各片都绿才算过
        run: |
          echo "类型 / 代码检查：${{ needs.lint.result }}；单元测试各片：${{ needs.unit.result }}"
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.unit.result }}" = success ]

  e2e-web-ent:
    name: E2E 网页·企业版开 ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      # 容器里没有 setup-node，npm 下载缓存自己存（10-24 提速）
      - name: 缓存 npm 下载
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('package-lock.json') }}
      # 装依赖断网（Prisma 引擎下载 ECONNRESET，10-28 #47 后 main 红过）重试 2 次，别整轮重跑
      - run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci 第 $i 次失败，15 秒后重试"; sleep 15; done
      # next build 用 Next 的增量编译缓存；源码没变的部分直接复用（10-24 提速）
      - name: 缓存 Next 构建
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'public/**') }}
          restore-keys: |
            next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-
      - run: npx prisma generate
        # 托管版的控制面客户端也要生成，否则 import @/generated/control 编译不过
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      # 默认网页验生产构建，避免只验证 dev server；仍使用隔离 E2E 库。
      # 每片各自 next build、各自跑 globalSetup 建空库；片内仍按文件串行
      # 网页用例在开着企业版开关的服务器上跑（2026-10-27）：桌面端 / 团队版攒下的流程就是企业版的回归标准。
      # 开关关着那遍 10-28 删了：这个仓库只发企业版。
      # 设计上就不一样的按文件跳过，名单和理由在 e2e-ent/网页用例企业版跳过.json
      # PR 上同一片挂满 2 条（重试后仍红才算）就停，别把剩下的跑完白等；推 main 照样全跑完，红几条看全（10-28）
      # 6 片（10-28，原 5 片）：按 main 绿跑各文件实测耗时模拟 playwright 的按条数切法，
      # 5 片最慢一片用例 ~188 秒、6 片 ~150 秒、7 片 ~128 秒；第 7 片再省 20 秒不值一台机器的固定开销（装依赖 + 构建 ~3–4 分钟）。
      # 最大的文件（workbench ~67 秒）远小于每片 ~105 秒的均值，不用拆文件
      - run: npx playwright test --shard=${{ matrix.shard }}/6 ${{ github.event_name == 'pull_request' && '--max-failures=2' || '' }}
        env:
          CRM_ENTERPRISE: "1"
          E2E_PROD: "1"
          HOME: /root
          # 用例的浏览器固定 Asia/Shanghai，服务端也要一致，否则日期文案水合失配
          TZ: Asia/Shanghai
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-web-ent-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  e2e-ent-flow:
    name: E2E 企业版主流程
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: 缓存 npm 下载
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('package-lock.json') }}
      # 装依赖断网（Prisma 引擎下载 ECONNRESET，10-28 #47 后 main 红过）重试 2 次，别整轮重跑
      - run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci 第 $i 次失败，15 秒后重试"; sleep 15; done
      - run: npx prisma generate
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      # 只有企业版才有的流程（2026-10-27）：四类账号、导入导出权限、跳转、组织设置、项目公海整体转让。
      # 自己的库和种子（e2e-ent/global-setup.ts），测试密码每轮随机、不进仓库
      - run: npm run test:ent -- ${{ github.event_name == 'pull_request' && '--max-failures=2' || '' }}
        env:
          HOME: /root
          TZ: Asia/Shanghai
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-ent-flow
          path: test-results/
          retention-days: 7

  e2e-layout:
    name: 排版闸门 ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: 缓存 npm 下载
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('package-lock.json') }}
      # 装依赖断网（Prisma 引擎下载 ECONNRESET，10-28 #47 后 main 红过）重试 2 次，别整轮重跑
      - run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci 第 $i 次失败，15 秒后重试"; sleep 15; done
      - name: 缓存 Next 构建
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'public/**') }}
          restore-keys: |
            next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-
      - run: npx prisma generate
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      # 发版前排版闸门（10-19）：企业版服务（e2e-layout/企业版.ts 建库灌数据，10-28 起）+ 像真客户的数据，1024/1280/1366 × AI 栏常驻 / 左栏最宽量主要页面越界、被盖住。
      # 这几天的显示 bug 都是客户先发现的，以后让它在这里先红。规则见 e2e/layout-audit.ts，不许为了变绿放宽
      # 不用 --shard：它按用例条数切、不看耗时。哪片跑哪几份写在 playwright.layout.config.ts 的分片表里，按实测秒数排（10-28）
      - run: npx playwright test -c playwright.layout.config.ts ${{ github.event_name == 'pull_request' && '--max-failures=2' || '' }}
        env:
          LAYOUT_SHARD: ${{ matrix.shard }}
          E2E_PROD: "1"
          HOME: /root
          TZ: Asia/Shanghai
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-layout-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # 速度闸门（10-29，测试规划 S4 + S12）：生产构建起服务，30 人 × 1 倍数据各压 60 秒，
  # A（全员看全部）和 B（按组织看，org-seed 后同一份库再压一轮）每页 p95 < 300 ms、0 出错；
  # 顺带量登录 / 首页 / 客户列表首屏 JS（HTML 里全部 script 逐个 gzip -6 求和），
  # 超上限或比 scripts/perf/first-js-baseline.json 涨 > 10% 就红。本机 1 倍 p95 ~50 ms，CI 机慢 2–3 倍也还有余量
  perf:
    name: 速度闸门
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 装依赖断网（Prisma 引擎下载 ECONNRESET，10-28 #47 后 main 红过）重试 2 次，别整轮重跑
      - run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci 第 $i 次失败，15 秒后重试"; sleep 15; done
      - name: 缓存 Next 构建
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'public/**') }}
          restore-keys: |
            next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-
      - run: npx prisma generate
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      - name: A：全员看全部 + 首屏 JS
        # 红了也把这轮的表留下（B 会覆盖 result.md），Summary 里两轮都看得到
        run: |
          rc=0; node scripts/perf/enterprise-p95.mjs --out /tmp/perf --scale 1 --duration 60 --extra --limit 300 --first-js || rc=$?
          cp /tmp/perf/result.md /tmp/perf/A.md 2>/dev/null || true
          exit $rc
        env:
          GATE: "1"
      - name: B：按组织看
        run: |
          DATABASE_URL=file:/tmp/perf/crm.db SEED=/tmp/perf/seed.json NODE_ENV=development npx tsx scripts/perf/enterprise-org-seed.ts
          node scripts/perf/enterprise-p95.mjs --out /tmp/perf --scale 1 --duration 60 --extra --limit 300 --reuse-db --skip-build
        env:
          GATE: "1"
      - name: 结果写进 Summary
        if: always()
        run: cat /tmp/perf/A.md /tmp/perf/result.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-gate
          path: |
            /tmp/perf/*.md
            /tmp/perf/*.json
            /tmp/perf/server.log
          retention-days: 7

  e2e:
    name: E2E
    needs: [e2e-web-ent, e2e-ent-flow, e2e-layout, perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 各片都绿才算过
        run: |
          echo "网页·企业版开：${{ needs.e2e-web-ent.result }}；企业版主流程：${{ needs.e2e-ent-flow.result }}；排版闸门：${{ needs.e2e-layout.result }}；速度闸门：${{ needs.perf.result }}"
          [ "${{ needs.e2e-web-ent.result }}" = success ] && [ "${{ needs.e2e-ent-flow.result }}" = success ] && [ "${{ needs.e2e-layout.result }}" = success ] && [ "${{ needs.perf.result }}" = success ]

  # 每轮 CI 的真实耗时写进本轮的 Summary：总墙钟 + 每个 job，便于盯「总耗时 ≤ 12 分钟」
  timing:
    name: 耗时
    needs: [check, e2e, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: 写耗时表
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" > jobs.json
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at > start.txt
          {
            echo "## CI 耗时"
            jq -r --arg start "$(cat start.txt)" '
              def t: fromdateiso8601;
              def mmss: "\(. / 60 | floor)分\(. % 60)秒";
              [.jobs[] | select(.name != "耗时" and .completed_at != null)] as $j
              | "总墙钟（开跑到最后一个 job 结束）：**\(([$j[].completed_at | t] | max) - ($start | t) | mmss)**",
                "",
                "| job | 结果 | 排队 | 运行 |",
                "|---|---|---|---|",
                ($j | sort_by(.started_at)[] | "| \(.name) | \(.conclusion) | \((.started_at | t) - (.created_at | t) | mmss) | \((.completed_at | t) - (.started_at | t) | mmss) |")
            ' jobs.json
          } >> "$GITHUB_STEP_SUMMARY"

  gitleaks:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 直接跑二进制而不用 gitleaks-action：后者对只有一个提交的历史会在 git log 上报
      # "stderr is not empty"（根提交没有父提交）。扫全部历史，不只是这次 push 的差量。
      - name: 安装 gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks version
      - name: 扫描全部提交
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

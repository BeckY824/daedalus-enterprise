# 「格律」设计语言样板的 Windows 截图（落地计划 1.2 第 2 条；P1，feat/b33-gelv-p1 不合并）
# 只手动触发、不进必过项：Actions → 格律样板 Windows 截图 → Run workflow，分支选 feat/b33-gelv-p1。
# 员工多数用 Windows，500 在雅黑上是粗体、Segoe UI 和苹方的字面不一样——没有 Windows 图，不拿「取代现状」去问用户。
# 数据全是排版闸门的假数据（e2e-layout/企业版.ts），产物可以发布。一轮约 25 分钟（npm ci + next build 占大头）。
name: 格律样板 Windows 截图

on:
  workflow_dispatch:
  # 手动触发要求 workflow 在默认分支上；样板分支不合并，所以推这些分支时也跑一次
  push:
    branches: ['feat/b33-gelv-*']

permissions:
  contents: read

jobs:
  shots:
    name: 格律样板 · windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # 第一步先核雅黑：GitHub 的 Windows 镜像按经验带简体中文字体，但没实跑过。不在就整轮失败，退回员工同款 Windows 1366 实机实拍
      - name: 核对微软雅黑在不在
        shell: pwsh
        run: |
          $f = Get-ChildItem C:\Windows\Fonts\msyh* -ErrorAction SilentlyContinue
          if (-not $f) { Write-Error "这台 runner 没有微软雅黑（C:\Windows\Fonts\msyh*），Windows 截图没有意义：退回员工同款 Windows 1366 实机实拍"; exit 1 }
          $f | ForEach-Object { Write-Output $_.Name }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 装依赖断网（Prisma 引擎下载 ECONNRESET）重试 2 次
      - name: 装依赖
        shell: bash
        run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci 第 $i 次失败，15 秒后重试"; sleep 15; done
      - run: npx prisma generate
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:./control-ci.db
      - run: npx playwright install chromium
      # 生产构建（E2E_PROD=1：先 next build 再 next start，和 CI 排版闸门同一条路）+ 假数据种子，跑样板截图
      - name: 截图（现在 / 格律 × 1366 / 390 × 浅 / 深，另 4 套主题各一张）
        run: npx playwright test -c playwright.gelv.config.ts
        env:
          E2E_PROD: "1"
          TZ: Asia/Shanghai
          GELV_SHOT_OS: windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gelv-shots-windows
          path: test-results/gelv-shots/
          retention-days: 14
